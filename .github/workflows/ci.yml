name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Validar pacote (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Validar metadados do pacote (pyproject.toml)
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist/

      - name: Verificar sintaxe de todos os módulos (compileall)
        run: python -m compileall -q privacylib

      - name: Checar formatação com ruff (não bloqueante)
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check privacylib || true
